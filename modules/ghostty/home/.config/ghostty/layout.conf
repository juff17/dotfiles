# The outer tmux: one session per Ghostty window, laying it out as btop on top,
# the viewer on the left and the tab session (tmux.conf) on the right. It runs
# on its own socket (tmux -L ghostty-layout) and stays out of the way, with no
# status bar and no prefix, so keys reach the tab session. bin/ghostty-surface
# builds each session.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys:clipboard:hyperlinks:usstyle:focus:sync"
set -s extended-keys on
set -s escape-time 10
set -g focus-events on
set -g set-clipboard on
# Lets the viewer, and programs in the tabs, show images in Ghostty.
set -g allow-passthrough on
set -g mouse on
set -g status off
set -g prefix None
set -g prefix2 None
unbind C-b

# Sessions are built detached, so one may only end with its window once its
# window has attached.
set-hook -g client-attached "set destroy-unattached on"

# btop's pane (@top) only displays, and the rails (@rail, see add_hub in
# bin/ghostty-lib.sh) take only clicks. Neither keeps focus, so keys meant for
# the viewer, the tabs or the hub can't land in them.
set-hook -g after-select-pane 'if -F "#{||:#{@top},#{@rail}}" "last-pane"'

# Mouse events over btop are dropped, so a stray click or a drag that runs up
# over it can't reach btop's menus. Elsewhere these are tmux's defaults, less
# the right-click pane menu with its Kill item.
# A click on a rail reaches the rail without selecting its pane.
bind -n MouseDown1Pane if -F "#{@rail}" { send-keys -M -t = } { if -F "#{!:#{@top}}" { select-pane -t = ; send-keys -M } }
bind -n MouseDown2Pane if -F "#{!:#{@top}}" { select-pane -t = ; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { paste-buffer -p } }
bind -n MouseDown3Pane if -F "#{!:#{@top}}" { select-pane -t = ; send-keys -M }
bind -n DoubleClick1Pane if -F "#{!:#{@top}}" { select-pane -t = ; send-keys -M }
bind -n TripleClick1Pane if -F "#{!:#{@top}}" { select-pane -t = ; send-keys -M }
bind -n MouseDrag1Pane if -F "#{!:#{@top}}" { if -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -M } }
bind -n WheelUpPane if -F "#{!:#{@top}}" { if -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e } }
bind -n WheelDownPane if -F "#{!:#{@top}}" { send-keys -M }
bind -n MouseUp1Pane if -F "#{!:#{@top}}" { send-keys -M }
bind -n MouseUp2Pane if -F "#{!:#{@top}}" { send-keys -M }
bind -n MouseUp3Pane if -F "#{!:#{@top}}" { send-keys -M }
bind -n MouseDrag2Pane if -F "#{!:#{@top}}" { send-keys -M }
bind -n MouseDrag3Pane if -F "#{!:#{@top}}" { send-keys -M }
bind -n MouseDragEnd1Pane if -F "#{!:#{@top}}" { send-keys -M }
unbind -n M-MouseDown3Pane

# The line under btop doesn't drag, so a pan that runs up over it can't start
# resizing btop. tmux gives that line to btop's pane; the divider beside the
# viewer, which belongs to the viewer, still drags. The hub's list keeps its
# width beside an open session (@peek), so the hub (@hub 1) and that session
# don't drag either.
bind -n MouseDrag1Border if -F -t = "#{!:#{||:#{@top},#{||:#{==:#{@hub},1},#{@peek}}}}" { resize-pane -M }

# Ghostty sends these for its tab keys (see config.ghostty), so tmux tabs work
# like Ghostty tabs: Ctrl+Shift+T new, Ctrl+Shift+W close, Ctrl+Tab /
# Ctrl+Shift+Tab or Ctrl+Shift+Right / Left next and previous, Ctrl+Shift+
# PageUp / PageDown move the tab left and right. They act on the window's tab
# session, whichever pane has focus, except in a session the hub opened
# (@peek), where they act on the tabs that pane shows.
set -s user-keys[0] "\e[9001~"
set -s user-keys[1] "\e[9002~"
set -s user-keys[2] "\e[9003~"
set -s user-keys[3] "\e[9004~"
set -s user-keys[4] "\e[9005~"
set -s user-keys[5] "\e[9006~"
set -s user-keys[6] "\e[9007~"
set -s user-keys[7] "\e[9008~"
bind -n User0 run-shell -b 'tmux -L ghostty new-window -t "#{?#{@peek},peek-#{s/%//:pane_id},#{s/^layout-/ghostty-/:session_name}}:" -c "##{pane_current_path}"'
bind -n User1 run-shell -b 'tmux -L ghostty kill-window -t "#{?#{@peek},peek-#{s/%//:pane_id},#{s/^layout-/ghostty-/:session_name}}:"'
bind -n User2 run-shell -b 'tmux -L ghostty next-window -t "#{?#{@peek},peek-#{s/%//:pane_id},#{s/^layout-/ghostty-/:session_name}}"'
bind -n User3 run-shell -b 'tmux -L ghostty previous-window -t "#{?#{@peek},peek-#{s/%//:pane_id},#{s/^layout-/ghostty-/:session_name}}"'
bind -n User4 run-shell -b 'tmux -L ghostty swap-window -d -s "#{?#{@peek},peek-#{s/%//:pane_id},#{s/^layout-/ghostty-/:session_name}}:" -t "#{?#{@peek},peek-#{s/%//:pane_id},#{s/^layout-/ghostty-/:session_name}}:-1"'
bind -n User5 run-shell -b 'tmux -L ghostty swap-window -d -s "#{?#{@peek},peek-#{s/%//:pane_id},#{s/^layout-/ghostty-/:session_name}}:" -t "#{?#{@peek},peek-#{s/%//:pane_id},#{s/^layout-/ghostty-/:session_name}}:+1"'

# Ctrl+Shift+A switches the window between the workspace and the agent hub,
# like the rail's work and hub buttons.
bind -n User6 if -F "#{==:#{window_name},hub}" { select-window -t :work } { select-window -t :hub }

# Ctrl+Shift+B goes back to the board from anywhere in the window: it shows
# the hub and closes the session the hub opened beside its list (the hub
# window's @peek_pane), so the workspace lands on the board too, not on a
# session left open there. Every format reads the hub window (-t :hub), as
# @peek_pane is its option, not the workspace's. The hub hears first (hub.mjs
# PEEK_CLOSING_KEY), so when its pane widens it draws the board straight
# away rather than the list stretched across.
bind -n User7 {
  select-window -t :hub
  if -F -t :hub "#{@peek_pane}" {
    run -C -t :hub 'send-keys -t "#{?#{==:#{@hub},1},#{pane_id},#{@hub}}" -l "\e[9101~"'
    run -C -t :hub 'kill-pane -t "#{@peek_pane}"'
    run -C -t :hub 'select-pane -t "#{?#{==:#{@hub},1},#{pane_id},#{@hub}}"'
  }
}

# Alt+S swaps focus between the hub's list and the session it opened beside
# it, so you can go back to the list, pick another agent with j/k and Enter,
# and land in its session without the mouse. The hub pane's own @hub is 1;
# every other pane's names the hub pane. Anywhere else, Alt+S goes through.
# run -C expands the formats, which a bare -t target wouldn't.
bind -n M-s if -F "#{&&:#{==:#{window_name},hub},#{@peek_pane}}" {
  run -C 'select-pane -t "#{?#{==:#{@hub},1},#{@peek_pane},#{@hub}}"'
} { send-keys M-s }

# Alt+N starts a new agent from anywhere in the window: the workspace, the
# board, its list or the session it opened. It shows the hub and hands its
# pane a key of its own (hub.mjs NEW_AGENT_KEY), which the hub answers even
# mid-filter, where an n would be typed. In the hub pane @hub is 1, so the
# target is that pane itself; anywhere else @hub names it.
bind -n M-n {
  select-window -t :hub
  run -C 'send-keys -t "#{?#{==:#{@hub},1},#{pane_id},#{@hub}}" -l "\e[9100~"'
}

# Alt+D shows Claude's diagrams for the tab you're looking at, in a window of
# their own (bin/ghostty-diagrams): in the workspace, the active tab. In the
# hub it hands the hub a key of its own (hub.mjs DIAGRAMS_KEY), since only
# the hub knows the tab of the session it opened or of the card selected on
# the board. In the diagrams window it goes through to dv, which closes.
# @conf is the folder this file is in, where bin/ is.
set -gF @conf "#{d:current_file}"
bind -n M-d if -F "#{==:#{window_name},diagrams}" { send-keys M-d } {
  if -F "#{==:#{window_name},hub}" {
    run -C 'send-keys -t "#{?#{==:#{@hub},1},#{pane_id},#{@hub}}" -l "\e[9103~"'
  } {
    run-shell -b '"#{@conf}/bin/ghostty-diagrams" "#{s/^layout-//:session_name}" "#{s/^layout-/ghostty-/:session_name}"'
  }
}

# Alt+H shows the keys in a popup over the whole window (bin/ghostty-help),
# opening on the hub's or the diagrams' keys when pressed there. Inside the
# popup Alt+H reaches the list, which closes it.
bind -n M-h run-shell -b '"#{@conf}/bin/ghostty-help" "#{client_name}" "#{window_name}"'

# Alt+T opens the todo list in a popup over the whole window, from the
# workspace, the board or a session the hub opened (bin/ghostty-todo-panel).
# Inside the popup Alt+T reaches the list, which closes it. Claude's own
# Alt+T (thinking on or off) never sees the key here; ~/.claude/keybindings.json
# turns it off outside the layout too. -d: the folder the list counts as
# "this repo" until it reads the active tab.
bind -n M-t display-popup -E -w 70% -h 75% -b rounded -S "fg=#89b4fa" -s "bg=#1e1e2e" -d "#{pane_current_path}" "~/.config/ghostty/bin/ghostty-todo-panel"

# Alt+E opens the current tab's repo in VS Code (bin/ghostty-code): the tab
# the hub's open session shows, while the hub has one open, and the
# workspace's active tab otherwise.
bind -n M-e run-shell -b '"#{@conf}/bin/ghostty-code" "#{?#{&&:#{==:#{window_name},hub},#{@peek_pane}},peek-#{s/%//:@peek_pane},#{s/^layout-/ghostty-/:session_name}}"'

# Ctrl+] does the same in the session pane itself (@peek), and passes through
# anywhere else.
bind -n C-] if -F "#{@peek}" {
  run -C 'send-keys -t "#{@hub}" -l "\e[9101~"'
  kill-pane
} { send-keys C-] }

# Catppuccin Mocha borders, matching the tab bar. The focused pane's border
# is blue; tmux colors the corner cells where dividers meet along with it.
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
