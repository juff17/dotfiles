# btop for the top of the Ghostty layout: just the CPU box, in the terminal's
# own colors so it follows the Ghostty theme. bin/ghostty-surface copies this
# to a scratch folder for each run, since btop rewrites its config on exit.
color_theme = "TTY"
theme_background = False
truecolor = True
rounded_corners = True
graph_symbol = "braille"
shown_boxes = "cpu"
update_ms = 1000
cpu_single_graph = False
show_uptime = True
check_temp = True
show_cpu_freq = False
clock_format = "%H:%M"
