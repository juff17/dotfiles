# The tab session of the Ghostty layout, nested in the window's outer tmux
# (layout.conf). It runs on its own socket (tmux -L ghostty), so it doesn't
# touch any other tmux you use. One session per Ghostty window; the session
# ends when its window closes.

set -g default-terminal "tmux-256color"
# The outer tmux passes these through from Ghostty.
set -as terminal-features ",tmux*:RGB:extkeys:clipboard:hyperlinks:usstyle:focus:sync"
set -s extended-keys on
set -s escape-time 10
set -g focus-events on
set -g set-clipboard on
# Lets programs inside tmux show images in Ghostty.
set -g allow-passthrough on
set -g mouse on
set -g history-limit 50000
set -g destroy-unattached on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
# A tab is named after its folder when it's the shell or Claude, so Claude tabs
# show the repo they're in, and after its program otherwise.
set -g automatic-rename-format "#{?#{||:#{m:*sh,#{pane_current_command}},#{==:#{pane_current_command},claude}},#{b:pane_current_path},#{pane_current_command}}"

# The diagram viewer shows the active tab's diagrams; this tells it the tab
# changed.
set-hook -g session-window-changed "run-shell -b 'touch \"\$XDG_RUNTIME_DIR/ghostty-layout/tab-changed\"'"
set-hook -g window-pane-changed "run-shell -b 'touch \"\$XDG_RUNTIME_DIR/ghostty-layout/tab-changed\"'"

# Rings from a tab you're not on turn it red.
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# Catppuccin Mocha tab bar, at the top, under btop.
set -g status-position top
set -g status-style "bg=#313244,fg=#a6adc8"
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #{=/24/…:#{b:pane_current_path}} #[default] "
set -g status-left-length 40
# Where you are among the tabs, as tab/tabs; a click on it opens the tab
# picker (Alt+G), which is the quick way round when there are many.
set -g status-right "#[range=user|tabs,fg=#cdd6f4,bold] ☰ #{window_index}/#{session_windows} #[norange,nobold,fg=#a6adc8]  %H:%M  %d %b "
set -g status-right-length 40
set -g window-status-separator ""
# A long name is cut to 20 characters, so more tabs fit on the bar.
#
# A tab running Claude carries its state's glyph from the agent hub's agentd
# (hub/agentd.mjs): ▲ needs you, ✻ working, ✓ done, ○ idle, ◉ watching.
set -g window-status-format " #I:#{=/20/…:window_name}#{?window_bell_flag,!,}#{?#{@agent}, #[fg=#{@agent_fg}]#{@agent}#[fg=default],}#[range=user|close-#{window_index},fg=#7f849c] × #[norange,fg=default]"
set -g window-status-current-format "#[bg=#45475a,fg=#cdd6f4,bold] #I:#{=/20/…:window_name}*#{?#{@agent}, #[fg=#{@agent_fg}]#{@agent}#[fg=#cdd6f4],}#[range=user|close-#{window_index},fg=#7f849c] × #[norange,fg=#cdd6f4]"
set -g window-status-bell-style "bg=#f38ba8,fg=#11111b,bold"

# When the tabs don't all fit, tmux scrolls the bar to keep the active tab in
# view and marks each side that has tabs cut off. Here those marks are a bold
# yellow ◀ and ▶ rather than its faint < and >, so it's clear there are more
# tabs that way. The rest is tmux's own status-format.
set -g status-format[0] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]#[fg=#11111b,bg=#f9e2af,bold] ◀ #[list=right-marker]#[fg=#11111b,bg=#f9e2af,bold] ▶ #[list=on default]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# @conf is the folder this file is in, where bin/ is.
set -gF @conf "#{d:current_file}"

# Each tab has a × that closes it. Clicking anywhere else on a tab selects it,
# and clicking the tab/tabs count on the right opens the tab picker.
# The click target takes in the spaces either side of the ×, because tmux puts
# a range one cell right of a wide-byte character like ×.
# A range's argument is fixed text by the time it's clicked, so the window
# number goes through run-shell, which expands formats.
bind -n MouseDown1Status if -F "#{m:close-*,#{mouse_status_range}}" {
  run-shell "tmux kill-window -t ':#{s/close-//:mouse_status_range}'"
} {
  if -F "#{==:#{mouse_status_range},tabs}" {
    run-shell -b '"#{@conf}/bin/ghostty-tabs" --from-tabs "#{session_name}"'
  } {
    switch-client -t =
  }
}
# Dragging a tab moves it: each drag step swaps the selected tab with the tab
# under the mouse, and -d keeps the dragged tab selected as it goes. In a mouse
# binding both ends of swap-window default to the tab under the mouse, so the
# selected tab is named through run-shell, which expands formats.
bind -n MouseDrag1Status run-shell "tmux swap-window -d -s '=#{session_name}:#{active_window_index}' -t '=#{session_name}:#{window_index}'"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
