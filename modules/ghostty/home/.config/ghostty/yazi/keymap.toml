# yazi runs as the Files mode of the Ghostty viewer pane (bin/ghostty-viewer),
# which reads where to go next from how yazi quits: plainly (writing its cwd
# file) for the next mode, without the cwd file for q's (Diagrams).
[[mgr.prepend_keymap]]
on = "<Tab>"
run = "quit"
desc = "Go to the next mode"

[[mgr.prepend_keymap]]
on = "q"
run = "quit --no-cwd-file"
desc = "Go to the diagrams, or close"
