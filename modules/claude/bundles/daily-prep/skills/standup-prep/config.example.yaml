# standup-prep configuration — TEMPLATE
#
# Copy this to config.yaml (which is gitignored) and fill in your real values:
#     cp config.example.yaml config.yaml
#
# Identity only. This skill reads your Jira + Slack activity for "yesterday" and
# writes a short standup update. It needs to know WHO YOU ARE so it can tell your
# work apart from everyone else's.

# --- Who you are -----------------------------------------------------------
# Jira identity. `currentUser()` in JQL already resolves to the authenticated
# account, so display_name/account_id are only used to read changelogs ("who moved
# this ticket") and to recognise yourself as the developer of a ticket. Set at
# least display_name; account_id is the most reliable if you have it.
jira:
  display_name: "Your Name"          # your Jira display name, exactly as it appears
  account_id: ""                      # optional but most reliable, e.g. "5b10a2...". Get it from `atlassianUserInfo`.
  email: ""                           # optional, used as a fallback to resolve you

# Slack identity. Used to find the messages YOU posted. user_id (Uxxxxxxxx) is the
# most reliable; handle is the human-friendly fallback the skill resolves to an ID.
slack:
  handle: "@you"                      # your Slack @handle
  user_id: ""                         # optional but most reliable, e.g. "U01ABCDEF". Resolve via slack_get_users.

# --- Time window -----------------------------------------------------------
timezone: America/New_York            # IANA tz; defines what "yesterday" means
lookback: previous_business_day       # previous_business_day | yesterday
                                      #   previous_business_day → on Mon, covers Fri+weekend

# --- Jira workflow vocabulary ---------------------------------------------
# Your board's column/status names. These vary per project — set them to match
# yours so the skill can classify movements correctly. Lists are matched case-
# insensitively; the FIRST matching status in a category wins for labelling.
statuses:
  todo:        ["To Do", "Selected for Development", "Open", "Backlog"]
  in_progress: ["In Progress", "In Development"]
  in_review:   ["In Review", "Code Review", "MR Review", "Review"]
  released:    ["Released", "Done", "Closed", "Deployed"]
  blocked:     ["Blocked", "Impediment", "On Hold"]

# Which field identifies the "software engineer" (the person who did the dev work)
# on a ticket — used so we never offer to review our own work. Common choices:
#   reporter            → the person who created/owns the ticket
#   assignee_history    → whoever was assigned while it was In Progress (read from changelog)
#   customfield_XXXXX   → a custom "Developer" / "Engineer" field, if your project has one
developer_field: reporter
