# slack-digest configuration
# Edit this to control which channels are tracked, how they're grouped,
# and what counts as noise. The skill reads ONLY what is listed here.
#
# THIS IS A TEMPLATE. Copy it to `config.yaml` (gitignored) and replace the
# placeholder handles, names, and channels below with your real ones.

# Time window to cover. `previous_business_day` means: on Mon, cover Fri+weekend.
lookback: previous_business_day   # options: previous_business_day | yesterday
timezone: America/New_York        # IANA tz; defines day boundaries

# ---------------------------------------------------------------------------
# GROUPS — channels bundled together and summarized as one section.
# Each group becomes one section in the digest. `focus` tunes what to extract.
#
# `members` (optional) lists the people ON this team, by @handle or by name
# (Slack handle, real name, or display name — @handle is most reliable). Each
# message is then labeled `affiliation: in_team | cross_team` so the summary can
# tell apart this team's own chatter from cross-team collaboration / outside input.
# OMIT `members` to skip labeling entirely — when absent, NO message gets an
# affiliation field, so no one is ever guessed to be in_team or cross_team.
# ---------------------------------------------------------------------------
groups:
  - name: "Your Core Team"
    channels: ["#team-channel-a", "#team-channel-b", "#team-channel-c"]
    members: ["@your-handle", "@teammate-handle", "Teammate Full Name"]
    focus: [decisions, pending_decisions, open_questions, cross_team_reviews]
    ignore_bot_messages: true     # drop all bot/webhook posts (CI, deploy, GitHub) in this group

  - name: "Cross-Team Projects"
    channels: ["#proj-channel-a", "#proj-channel-b"]
    members: ["@your-handle", "@partner-handle-1", "@partner-handle-2"]
    focus: [decisions, pending_decisions, open_questions, cross_team_reviews]
    ignore_bot_messages: true

  - name: "Product ↔ Engineering"
    channels: ["#product-sync", "#roadmap", "#customer-feedback"]
    # no members listed → affiliation labeling is skipped for this group
    focus: [decisions, pending_decisions, open_questions, feature_requests, customer_updates]
    ignore_bot_messages: true

# ---------------------------------------------------------------------------
# ANNOUNCEMENTS — not discussion. Mined for action items the reader must DO.
# (e.g. "rebuild your local containers", "rotate this credential")
# ---------------------------------------------------------------------------
announcements:
  channels: ["#announcements", "#releases", "#dev-environment"]
  mode: action_items
  ignore_bot_messages: false      # keep bot posts here — deploy/CI bots ARE the action item

# ---------------------------------------------------------------------------
# NOISE — cut before any expensive analysis. Tune these as you see what slips
# through or gets wrongly dropped.
# ---------------------------------------------------------------------------
noise:
  drop_message_patterns:        # day-to-day low-value chatter
    - "where is"
    - "how do I"
    - "anyone know"
    - "is * down"
    - "quick question"
  thread_lookback_days: 30      # scan this far back to catch threads still active today

# ---------------------------------------------------------------------------
# OUTPUT — the digest is presented in the chat. The audience (Engineering,
# Product, Sales, Operations, …) and any topics to focus on come from the prompt;
# with neither, the digest is a general cross-functional overview.
# ---------------------------------------------------------------------------
title: "Daily Digest — {date}"   # used as the H1 heading
