# The tab session of the Ghostty layout, nested in the window's outer tmux
# (layout.conf). It runs on its own socket (tmux -L ghostty), so it doesn't
# touch any other tmux you use. One session per Ghostty window; the session
# ends when its window closes.

set -g default-terminal "tmux-256color"
# The outer tmux passes these through from Ghostty.
set -as terminal-features ",tmux*:RGB:extkeys:clipboard:hyperlinks:usstyle:focus"
set -s extended-keys on
set -s escape-time 10
set -g focus-events on
set -g set-clipboard on
# Lets programs inside tmux show images in Ghostty.
set -g allow-passthrough on
set -g mouse on
set -g history-limit 50000
set -g destroy-unattached on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
# A tab is named after its program, or its folder when it's just the shell.
set -g automatic-rename-format "#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}"

# The diagram viewer shows the active tab's diagrams; this tells it the tab
# changed.
set-hook -g session-window-changed "run-shell -b 'touch \"\$XDG_RUNTIME_DIR/ghostty-layout/tab-changed\"'"
set-hook -g window-pane-changed "run-shell -b 'touch \"\$XDG_RUNTIME_DIR/ghostty-layout/tab-changed\"'"

# Rings from a tab you're not on turn it red.
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# Catppuccin Mocha tab bar, at the top, under btop.
set -g status-position top
set -g status-style "bg=#313244,fg=#a6adc8"
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #{b:pane_current_path} #[default] "
set -g status-left-length 40
set -g status-right "#[fg=#a6adc8]%H:%M  %d %b "
set -g window-status-separator ""
set -g window-status-format " #I:#W#{?window_bell_flag,!,}#[range=user|close-#{window_index},fg=#7f849c] × #[norange,fg=default]"
set -g window-status-current-format "#[bg=#45475a,fg=#cdd6f4,bold] #I:#W*#[range=user|close-#{window_index},fg=#7f849c] × #[norange,fg=#cdd6f4]"
set -g window-status-bell-style "bg=#f38ba8,fg=#11111b,bold"

# Each tab has a × that closes it. Clicking anywhere else on a tab selects it.
# The click target takes in the spaces either side of the ×, because tmux puts
# a range one cell right of a wide-byte character like ×.
# A range's argument is fixed text by the time it's clicked, so the window
# number goes through run-shell, which expands formats.
bind -n MouseDown1Status if -F "#{m:close-*,#{mouse_status_range}}" {
  run-shell "tmux kill-window -t ':#{s/close-//:mouse_status_range}'"
} {
  switch-client -t =
}
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
